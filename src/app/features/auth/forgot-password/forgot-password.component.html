<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>TicketFlow</mat-card-title>
      <mat-card-subtitle>Password Recovery</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p class="instruction-text">
        Enter your email address and we'll send you a link to reset your
        password.
      </p>

      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>E-mail</mat-label>
          <input
            matInput
            formControlName="email"
            type="email"
            placeholder="example@ticketflow.com"
          />
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="forgotForm.get('email')?.hasError('email')"
            >Invalid email address</mat-error
          >
          <mat-error *ngIf="forgotForm.get('email')?.hasError('required')"
            >Email is required</mat-error
          >
        </mat-form-field>

        <div *ngIf="errorMessage" class="error-alert">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="success-alert">
          {{ successMessage }}
        </div>

        <div class="actions">
          <button
            mat-flat-button
            color="primary"
            type="submit"
            [disabled]="forgotForm.invalid || isLoading"
            class="full-width"
          >
            {{ isLoading ? "Sending..." : "Send Recovery Link" }}
          </button>
        </div>
      </form>
    </mat-card-content>

    <mat-divider></mat-divider>

    <mat-card-actions class="register-prompt">
      <button mat-button color="primary" routerLink="/login">
        Back to Login
      </button>
    </mat-card-actions>
  </mat-card>
</div>
